version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ses-quiz-db
    environment:
      POSTGRES_DB: ses_quiz
      POSTGRES_USER: ses_quiz_user
      POSTGRES_PASSWORD: ses_quiz_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ses_quiz_user -d ses_quiz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
