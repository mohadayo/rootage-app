databases:
  - name: rootage-db
    plan: free
    databaseName: rootage
    user: rootage_user

services:
  - type: web
    name: rootage
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerArgs:
      VITE_ENABLE_RAG: true
    envVars:
      - key: DB_URL
        fromDatabase:
          name: rootage-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SERVER_PORT
        value: "8080"
      - key: CORS_ORIGIN
        value: ""
      # 実際の社員のドメインをダッシュボードで設定する（プレースホルダを焼き込まない）
      - key: ALLOWED_EMAIL_DOMAIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # パスワードリセットの送信元。Resend で検証済みドメインのアドレスを設定する
      # （onboarding@resend.dev のままだと本人以外に配送されない）
      - key: MAIL_FROM
        sync: false
      - key: BASE_URL
        value: https://rootage.onrender.com
      # 初回デプロイ時に管理者を作成するためダッシュボードで設定する
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
